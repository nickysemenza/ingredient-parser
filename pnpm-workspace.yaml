packages:
  - ui

# One version of each frontend dependency, declared once.
catalog:
  "@base-ui/react": ^1.9.0
  "@playwright/test": ^1.65.0
  "@tailwindcss/vite": ^4.3.5
  "@tanstack/react-virtual": ^3.14.26
  "@tauri-apps/api": ^2.12.4
  "@tauri-apps/cli": ^2.12.4
  "@tauri-apps/plugin-clipboard-manager": ^2.5.0
  "@tauri-apps/plugin-dialog": ^2.8.4
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.9
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  clsx: ^2.1.1
  cmdk: ^1.1.1
  jsdom: ^31.0.0
  lucide-react: ^1.71.0
  oxlint: ^1.93.0
  react: ^19.3.1
  react-dom: ^19.3.1
  sonner: ^2.0.8
  tailwindcss: ^4.3.5
  typescript: ^7.0.2
  vite: ^8.3.7
  vitest: ^5.1.0
  wrangler: ^4.159.0

allowBuilds:
  esbuild: true
  workerd: true

# pnpm's default release-age window is one day. These versions are inside
# that window; name them so a frozen install still accepts the bump.
