[package]
name = "ingredient"
version = "0.4.0"
authors = ["nickysemenza"]
edition.workspace = true
rust-version.workspace = true
description = "recipe ingredient parser"
license = "MIT"
repository = "https://github.com/nickysemenza/ingredient-parser"
# NOTE: git tracks the file as lowercase `readme.md`; the path must match
# exactly or `cargo package`/`publish` fails on case-sensitive filesystems.
readme = "readme.md"
keywords = ["recipe", "ingredient", "parser", "cooking", "nlp"]
categories = ["parsing", "text-processing"]
# The integration tests dev-depend on the unpublished `ingredient-corpus`, so
# shipping `tests/` would give the published tarball a `cargo test` that cannot
# resolve its dependency. `benches/` must NOT be excluded — `[[bench]]` below
# names a file, and packaging fails if it is missing.
exclude = ["/tests"]


[features]
default = []
bench = ["dep:criterion"]
# Opt-in TypeScript declarations for the public data types (`Ingredient`,
# `Measure`, `IngredientUsage`, `Confidence`). Neither feature changes runtime
# behavior or the JSON shape; they only add derives so downstream crates can
# generate `.d.ts` from the same structs they serialize.
typescript = ["dep:ts-rs"]
wasm = ["dep:tsify-next", "dep:wasm-bindgen"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
petgraph = "0.8.0"
nom-language = "0.1.0"
regex = "1.10"
num-rational = { version = "0.4", default-features = false }
num-traits = "0.2"
thiserror.workspace = true
criterion = { version = "0.8", features = ["html_reports"], optional = true }
ts-rs = { workspace = true, optional = true }
tsify-next = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }


[dependencies.nom]
version = "8.0.0"
default-features = false
features = ["alloc"]

[dev-dependencies]
proptest = "1.5"
rstest.workspace = true
insta = "1"
ingredient-corpus.workspace = true

[[bench]]
name = "parser_benchmarks"
harness = false
required-features = ["bench"]

[lints]
workspace = true
