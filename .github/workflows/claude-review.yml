name: Claude PR Review

on:
  pull_request:
    # Review on open and on every push to the PR.
    types: [opened, synchronize]

# If a new commit is pushed while a review is still running, cancel the
# stale review — only the latest commit gets reviewed (saves usage budget).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip bot-authored PRs (Renovate, Dependabot): the action refuses to review
    # non-human actors and would otherwise post a failing "review" check that
    # blocks Renovate's automerge — and reviewing dependency bumps wastes budget.
    if: ${{ github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write  # required for the action's OIDC token exchange
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this PR following the conventions in AGENTS.md. Post concise,
            actionable inline comments anchored to the diff. Skip nitpicks, style
            preferences, and praise. If the PR is clean, say so in one line.
