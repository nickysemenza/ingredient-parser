on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: build + test

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

# Cancel superseded runs on the same ref to avoid wasting CI minutes on stale
# pushes. Never cancel main: cancel-in-progress is scoped off so a push to
# main can't kill a deploy that's already mid-flight from an earlier push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@b619ad904e146bb2e5a34e01fabb1565badc1df3 # cargo-nextest
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo nextest run --workspace --profile ci
      - name: Run doctests
        run: cargo test -p ingredient --doc
      # Browser callers build cookbook with `default-features = false`
      # and supply browser transport to the shared driver. Keep the complete
      # runtime-independent interface buildable for that downstream.
      - name: Check cookbook's pure (non-native) half still compiles
        run: |
          cargo check -p cookbook --no-default-features
          cargo test -p cookbook --no-default-features --lib
  wasm-tests:
    name: wasm tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # jetli/wasm-pack-action targets Node 20, which the runner now forces
      # onto Node 24, where its "search the latest version" HTTPS call
      # intermittently dies with a self-signed-certificate error. This repo
      # already installs its other Rust tools with install-action, which
      # fetches a pinned release and needs no version lookup.
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      # The browser build's command boundary: the same dispatch table the
      # desktop calls natively, compiled to wasm32 and run under Node.
      - name: Run food-wasm boundary tests
        run: wasm-pack test --node food-wasm
      - name: Check the cookbook crate's wasm boundary
        run: >-
          cargo check -p cookbook --target wasm32-unknown-unknown
          --no-default-features --features wasm
  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@3a7f9c7e491f886d38a27cc2e084e2d9218068c6 # cargo-llvm-cov
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Generate code coverage
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info \
            --exclude food-cli --exclude food-app --exclude food-wasm
      - name: Upload to codecov.io
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          # The `latest` CLI channel can serve a checksum/signature pair that
          # fails GPG verification (CDN skew); pin so uploads are reproducible.
          version: v11.3.0
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.99"
      - name: Check the published crate builds on its declared MSRV
        # 1.88 is the workspace floor: edition 2024 + let-chains (from clippy's
        # collapsible_if) stabilized there. Default features only.
        run: cargo +1.88 check -p ingredient
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
          components: rust-src
          # cargo-fuzz defaults to the musl target on Linux, where ASan is
          # incompatible with the static libc. Build/run against gnu instead.
          target: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: cargo-fuzz
      - name: Smoke-fuzz each ingredient-parser target (30s each)
        # Short run to catch crashes/panics on PRs; deep runs are manual/scheduled.
        working-directory: ingredient-parser
        run: |
          for target in from_str parse_amount rich_text; do
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=4096
          done
      - name: Smoke-fuzz each recipe-scraper target (30s each)
        # Skipped if the fuzz crate doesn't exist yet, so this step stays green
        # regardless of landing order with the PR that adds it.
        if: hashFiles('recipe-scraper/fuzz/Cargo.toml') != ''
        working-directory: recipe-scraper
        run: |
          for target in scrape; do
            cargo +nightly fuzz run "$target" --target x86_64-unknown-linux-gnu -- -max_total_time=30 -rss_limit_mb=4096
          done
  bench:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Run benchmarks once (criterion --test) so they keep compiling and executing
        run: cargo bench -p ingredient --features bench -- --test
  ui:
    name: ui (web + desktop shell, E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # pnpm version comes from `packageManager` in package.json
      # (Renovate keeps it bumped); a floating spec here would chase brand-new
      # pnpm releases and can break CI on all branches at once.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: wasm-pack
      - name: Check the generated TypeScript contract
        run: cargo run -p food-app --example export_bindings -- --check
      # `tsc` (inside the build) typechecks the app against the freshly
      # generated wasm `.d.ts` and the ts-rs contract.
      - name: Build site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: pnpm --filter @ingredient-parser/ui lint
      - run: pnpm --filter @ingredient-parser/ui test
      - run: pnpm --filter @ingredient-parser/ui exec playwright install --with-deps chromium webkit
      - run: cargo run -p food-app --example create_run_fixture -- /tmp/food-app-qa
      - name: E2E (web against WASM, desktop shell against the fixture)
        run: pnpm --filter @ingredient-parser/ui test:e2e
      - name: Seal and verify E2E evidence
        if: always()
        run: |
          if [ -f /tmp/food-app-qa/frontend-fixture.json ] && [ -f ui/test-results/results.json ]; then
            cargo run -p food-app --example e2e_artifact -- seal /tmp/food-app-qa ui/test-results
          fi
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-e2e-evidence
          path: /tmp/food-app-qa/e2e-artifact
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  # The website is a Worker serving static assets (ui/wrangler.jsonc).
  # Wrangler is pinned in the lockfile. Pushes to main deploy production.
  deploy:
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ingredient.nickysemenza.com
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # pnpm version comes from `packageManager` in package.json
      # (Renovate keeps it bumped); a floating spec here would chase brand-new
      # pnpm releases and can break CI on all branches at once.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # jetli/wasm-pack-action targets Node 20, which the runner now forces
      # onto Node 24, where its "search the latest version" HTTPS call
      # intermittently dies with a self-signed-certificate error. This repo
      # already installs its other Rust tools with install-action, which
      # fetches a pinned release and needs no version lookup.
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: wasm-pack
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
      - name: Build site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Deploy
        working-directory: ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
        run: pnpm exec wrangler deploy --message "${GITHUB_SHA::7}"
  # Each pull request from this repository gets a Worker Preview named
  # pr-<number>, updated on every push and deleted when the PR closes
  # (preview-cleanup.yml). Forks get no secrets, so they skip.
  preview:
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Preview on Cloudflare Workers
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # pnpm version comes from `packageManager` in package.json
      # (Renovate keeps it bumped); a floating spec here would chase brand-new
      # pnpm releases and can break CI on all branches at once.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # jetli/wasm-pack-action targets Node 20, which the runner now forces
      # onto Node 24, where its "search the latest version" HTTPS call
      # intermittently dies with a self-signed-certificate error. This repo
      # already installs its other Rust tools with install-action, which
      # fetches a pinned release and needs no version lookup.
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: wasm-pack
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: wasm32-unknown-unknown
      - name: Build site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload preview
        id: preview
        working-directory: ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
          NAME: pr-${{ github.event.pull_request.number }}
        run: |
          pnpm exec wrangler preview --name "$NAME" --message "${GITHUB_SHA::7}" | tee "$RUNNER_TEMP/preview.log"
          url=$(grep -oE 'https://[^ "]+\.workers\.dev[^ "]*' "$RUNNER_TEMP/preview.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
  desktop-macos:
    name: macOS desktop
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          components: clippy, rustfmt
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2
        with:
          tool: wasm-pack
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ingredient-parser/ui wasm
      - run: cargo test -p food-app
      - run: cargo clippy -p food-app --all-targets -- -D warnings
      - run: pnpm --filter @ingredient-parser/ui desktop:build --debug
