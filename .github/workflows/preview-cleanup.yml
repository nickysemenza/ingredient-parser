# Delete a pull request's Worker Preview (created by the `preview` job in
# rust.yml) once the PR is merged or closed.
on:
  pull_request:
    types: [closed]

name: preview cleanup

jobs:
  delete-preview:
    name: Delete Worker Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter @ingredient-parser/ui
      - name: Delete preview
        working-directory: ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9f10f078d35d86c78dedece2300a6b88
          NAME: pr-${{ github.event.pull_request.number }}
        # A PR whose preview never deployed (e.g. CI failed early) has none;
        # that is the only failure tolerated.
        run: |
          if ! pnpm exec wrangler preview delete --name "$NAME" --skip-confirmation 2>&1 | tee "$RUNNER_TEMP/delete.log"; then
            grep -qiE 'not found|does not exist' "$RUNNER_TEMP/delete.log" || exit 1
            echo "No preview named $NAME"
          fi
