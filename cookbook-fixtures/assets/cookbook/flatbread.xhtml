<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en"><head><title>Flatbread</title></head><body>
<h1>Flatbread</h1>
<p>Synthetic fixture for desktop layout validation.</p>
<p>4 servings</p>
<h2>Ingredients</h2>
<p class="ingredient">2 cups all-purpose flour, sifted</p>
<p class="ingredient">1 tsp sea salt</p>
<p class="ingredient">3/4 cup warm water</p>
<h2>Instructions</h2>
<p class="instruction">Combine the ingredients and cook until ready.</p>
</body></html>
