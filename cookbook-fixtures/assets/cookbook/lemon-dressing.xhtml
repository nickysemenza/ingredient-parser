<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en"><head><title>Lemon dressing</title></head><body>
<h1>Lemon dressing</h1>
<p>Synthetic fixture for desktop layout validation.</p>
<p>4 servings</p>
<h2>Ingredients</h2>
<p class="ingredient">3 tbsp extra virgin olive oil</p>
<p class="ingredient">juice of 1 lemon</p>
<p class="ingredient">1 tsp Dijon mustard</p>
<h2>Instructions</h2>
<p class="instruction">Combine the ingredients and cook until ready.</p>
</body></html>
