[package]
name = "food-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
default-run = "food-app"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
recipe-parsing.workspace = true
recipe-scraper.workspace = true
recipe-scraper-fetcher.workspace = true
cookbook = { workspace = true, features = ["typescript", "test-support"] }
recipe-types = { workspace = true, features = ["typescript"] }
ingredient = { workspace = true, features = ["typescript"] }
ingredient-corpus.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true
tracing-subscriber = "0.3"
dotenvy.workspace = true
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
cookbook-fixtures.workspace = true
tempfile = "3"

[lints]
workspace = true
