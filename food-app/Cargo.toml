[package]
name = "food-app"
version = "0.1.0"
edition.workspace = true
# Tauri 2.12 requires 1.90, above the workspace floor.
rust-version = "1.90"
license = "MIT"
publish = false
default-run = "food-app"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
food-core.workspace = true
recipe-scraper-fetcher.workspace = true
cookbook = { workspace = true, features = ["typescript", "test-support"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing-subscriber = "0.3"
dotenvy.workspace = true
ts-rs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
recipe-scraper.workspace = true
ingredient-corpus.workspace = true
cookbook-fixtures.workspace = true
tempfile = "3"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = "0.23"

[lints]
workspace = true
